server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # O roteamento é do lado do cliente: qualquer caminho desconhecido devolve
    # o index.html, senão recarregar em /eventos/123 daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets têm hash no nome, então podem ser cacheados sem receio.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index.html nunca: é ele que aponta para a versão nova dos assets.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
